spec:
  credentials:
    - name: openai
      provider: openai
      secretRef:
        - name: openclaw-instance-openai-api-key
          key: api-key
  customProviders: []
  network:
    inClusterBypass: false
    additionalEgress: []
  config:
    # Clear guarded model settings retained in the persistent configuration.
    # Restore merge mode only after this direct configuration has rolled out.
    mergeMode: overwrite
    raw:
      agents:
        defaults:
          model:
            primary: openai/gpt-5.5
            fallbacks:
              - openai/gpt-5.4
              - openai/gpt-5.4-mini
